services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: smartdesk
      POSTGRES_DB: smartdesk
    ports:
      - '5432:5432'
    volumes:
      - smartdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartdesk']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://smartdesk:smartdesk@postgres:5432/smartdesk
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - '4000:4000'
    # Applies the schema and seeds the knowledge base on every start; both
    # are idempotent (CREATE TABLE IF NOT EXISTS / ON CONFLICT upserts), so
    # this is safe to run repeatedly.
    command: sh -c "npm run db:setup && npm start"

volumes:
  smartdesk_pgdata:
