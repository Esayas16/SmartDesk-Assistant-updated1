<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#05080d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartDesk Assistant</title>
    <meta name="description" content="Offline-first IT troubleshooting and hybrid AI diagnostic assistant." />
    <script type="text/javascript">
      // Apply the saved theme before React mounts so there is no flash of
      // the wrong theme on load. Mirrors settingsService's storage key.
      (function () {
        try {
          var raw = window.localStorage.getItem('smartdesk:settings');
          var theme = (raw && JSON.parse(raw).theme) || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="text/javascript">
      // Pairs with public/404.html: decodes the redirected deep link back into a real
      // path so React Router sees the URL the user actually requested.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
