<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so deep links (e.g. /smartdesk/dashboard)
      // 404 on refresh. This redirects them back through index.html so React Router can
      // take over. See: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // number of segments in the repo base path, e.g. "smartdesk"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
